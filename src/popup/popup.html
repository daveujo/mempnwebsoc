<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mephisto</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="/lib/chessboard/chessboard.min.css">
    <link rel="stylesheet" href="/lib/materialize/materialize.min.css">
    <link rel="stylesheet" href="/lib/materialize/material-icons.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto&display=swap">
    <script src="/lib/jquery.min.js"></script>
    <script src="/lib/lru.min.js"></script>
    <script src="/lib/chessboard/chessboard.min.js"></script>
    <script src="/lib/materialize/materialize.min.js"></script>
    <script type="module" src="popup.js"></script>
</head>

<body>
    <!-- Action Buttons -->
    <button id="config" class="waves-effect waves-light btn tooltipped" data-position="left" data-tooltip="Settings">
        <i class="medium material-icons">settings</i>
    </button>
    
    <button id="pop-out" class="waves-effect waves-light btn tooltipped" data-position="right" data-tooltip="Floating Window">
        <i class="medium material-icons">open_in_new</i>
    </button>

    <button id="dark-mode-toggle" class="waves-effect waves-light btn tooltipped" data-position="top" data-tooltip="Toggle Dark Mode">
        <i id="dark-mode-icon" class="medium material-icons">brightness_4</i>
    </button>

    <!-- WebSocket Mode Controls -->
    <div id="ws-controls" style="display: none;">
        <div class="ws-control-row">
            <button id="panic-toggle" class="ws-btn tooltipped" data-position="bottom" data-tooltip="Panic Mode (P): Ultra-fast moves">
                <i class="material-icons">flash_on</i>
            </button>
            <button id="human-toggle" class="ws-btn tooltipped" data-position="bottom" data-tooltip="Human Mode (H): Realistic delays">
                <i class="material-icons">person</i>
            </button>
            <button id="varied-toggle" class="ws-btn ws-btn-active tooltipped" data-position="bottom" data-tooltip="Varied Mode (V): Multi-PV selection">
                <i class="material-icons">shuffle</i>
            </button>
        </div>
        <div class="ws-control-row">
            <select id="preset-selector" class="browser-default ws-select">
                <option value="7.5s">7.5s Blitz</option>
                <option value="15s" selected>15s Rapid</option>
                <option value="30s">30s Classical</option>
            </select>
            <button id="lag-cycler" class="ws-btn tooltipped" data-position="bottom" data-tooltip="VPN Lag Offset (L): 0ms">
                <span id="lag-value">+0</span>
            </button>
        </div>
        <div id="ws-stats" class="ws-stats">
            <span id="stat-avg">Avg: --</span> | 
            <span id="stat-pv1">PV1: --</span> | 
            <span id="stat-blunders">Blunders: 0</span>
        </div>
    </div>

    <!-- Visual Overlays -->
    <div id="move-annotations"></div>
    <div id="response-annotations"></div>

    <!-- Interface Elements -->
    <div id="game-detection">No Chess Game Detected</div>

    <div id="board"></div>

    <div id="moves">
        <div id="chess_line_1">If your chess game is not detected<br>try reloading the page</div>
        <div id="chess_line_2"></div>
    </div>
    <div id="evaluation"></div>
</body>
</html>
